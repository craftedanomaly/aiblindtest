<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151713">
    <meta name="description" content="Rate AI-generated images without seeing which model made them. Compare your picks with the community.">
    <title>The Blind Image Test</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="landing" id="landing">
      <img class="landing-image" src="/media/52dac3a2c5b5bd951ac2a24b.webp" alt="" fetchpriority="high">
      <section class="hero" id="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">The Blind<br>Image Test</h1>
        <p class="hero-description">Rate images made from the same prompt without knowing which AI model made them.</p>
        <div class="hero-actions">
          <button type="button" class="action" id="start-test" disabled>Start test <span class="arrow" aria-hidden="true"></span></button>
          <button type="button" class="action secondary" id="open-community" disabled>Community results <span class="arrow" aria-hidden="true"></span></button>
        </div>
        <p id="autosave-notice" hidden>Each rating counts, even if you leave early.</p>
        <p id="home-status" class="home-status" role="status">Loading the test…</p>
        <noscript><p class="home-status">Enable JavaScript to take the test.</p></noscript>
      </section>
      <section class="community-panel" id="community" aria-labelledby="community-title" hidden>
        <button type="button" class="back-link" id="back-home"><span class="arrow" aria-hidden="true"></span> Back to test</button>
        <h2 id="community-title" tabindex="-1">Community results</h2>
        <div class="community-content" id="community-content"></div>
      </section>
      <a class="project-credit" href="https://craftedanomaly.com/">Crafted Anomaly Project</a>
    </main>
    <dialog id="review" aria-label="Blind image review"></dialog>
    <dialog class="finish-confirmation" id="finish-confirmation" aria-labelledby="finish-title" aria-describedby="finish-remaining finish-note">
      <h2 id="finish-title">Finish the test early?</h2>
      <p id="finish-remaining"></p>
      <p class="quiet" id="finish-note">Your results will only reflect the images you rated.</p>
      <form method="dialog" class="confirmation-actions">
        <button type="submit" class="action secondary" value="continue" autofocus>Keep rating</button>
        <button type="submit" class="action" value="finish">Finish test</button>
      </form>
    </dialog>
  </body>
</html>
